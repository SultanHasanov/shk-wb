map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name shk-wb.ru www.shk-wb.ru;

    client_max_body_size 5m;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Supabase (*.supabase.co) из России открывается нестабильно, поэтому браузер
    # ходит к нему через этот же домен: https://shk-wb.ru/supabase/auth/v1/...
    # Имя через переменную + resolver — чтобы nginx перечитывал IP Supabase,
    # а не держал адрес, полученный при старте.
    location /supabase/ {
        resolver 77.88.8.8 1.1.1.1 valid=300s ipv6=off;
        set $supabase ouxsvlfaszsaykzpnkwh.supabase.co;
        rewrite ^/supabase/(.*)$ /$1 break;
        proxy_pass https://$supabase;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $supabase;
        proxy_set_header Host $supabase;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Realtime работает по WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Приложение берёт первый адрес из X-Forwarded-For для rate limit,
        # поэтому передаём только настоящий IP, а не то, что прислал клиент.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Генерация PDF на Vercel имела лимит 60 с.
        proxy_read_timeout 90s;
    }
}
