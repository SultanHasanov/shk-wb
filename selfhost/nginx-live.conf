# Боевой конфиг nginx для shk-wb.ru — то, что реально лежит в
# /etc/nginx/sites-enabled/shk-wb. ЭТОТ файл — источник истины для живого
# сервера; применять его через `bash selfhost/nginx-sync.sh root@<host>`.
#
# Почему он отдельный от nginx.conf. setup.sh копирует nginx.conf и сразу
# делает `nginx -t` — на чистой машине сертификатов Let's Encrypt ещё нет,
# поэтому в nginx.conf не может быть ни listen 443, ни ssl_certificate:
# конфиг просто не пройдёт проверку. Порядок такой: setup.sh ставит
# nginx.conf (только порт 80) → certbot --nginx выпускает сертификат и
# дописывает TLS → дальше живая конфигурация ведётся здесь.
#
# Строки «# managed by Certbot» оставлены как есть: certbot при продлении
# сертификата ищет свои пометки и server-блоки не перезаписывает. Правки
# руками на сервере делать нельзя — они разойдутся с репозиторием, как уже
# было: редирект www внесли по месту, а `proxy_buffering off` из
# nginx.conf (коммит 3001b176) на сервер, наоборот, так и не попал.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    server_name shk-wb.ru www.shk-wb.ru;

    # Канонический хост — без www. Раньше www отдавал тот же сайт с кодом 200:
    # для поиска это второй адрес каждой страницы, и склейка держалась только
    # на canonical. Теперь склейка явная, редиректом.
    if ($host = www.shk-wb.ru) {
        return 301 https://shk-wb.ru$request_uri;
    }

    client_max_body_size 5m;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Supabase (*.supabase.co) из России открывается нестабильно, поэтому браузер
    # ходит к нему через этот же домен: https://shk-wb.ru/supabase/auth/v1/...
    # Имя через переменную + resolver — чтобы nginx перечитывал IP Supabase,
    # а не держал адрес, полученный при старте.
    location /supabase/ {
        resolver 77.88.8.8 1.1.1.1 valid=300s ipv6=off;
        set $supabase ouxsvlfaszsaykzpnkwh.supabase.co;
        rewrite ^/supabase/(.*)$ /$1 break;
        proxy_pass https://$supabase;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $supabase;
        proxy_set_header Host $supabase;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Realtime работает по WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Установщики «Помощника ПВЗ» отдаёт сам nginx: старая программа «Подбор кодов»
    # качает обновление через urllib по HTTP/1.1, а GitHub из России доступен не у всех.
    # При выпуске версии копировать setup.exe сюда как pvz-helper-<версия>-setup.exe.
    location /dl/ {
        alias /srv/shk-wb/app-updates/pvz-helper/public/;
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
        add_header Content-Disposition "attachment";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Приложение берёт первый адрес из X-Forwarded-For для rate limit,
        # поэтому передаём только настоящий IP, а не то, что прислал клиент.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Генерация PDF на Vercel имела лимит 60 с.
        proxy_read_timeout 90s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shk-wb.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shk-wb.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    # www уводим сразу на апекс по https: редирект, который ставит certbot,
    # сохраняет хост и даёт лишний переход www → https://www → https://apex.
    if ($host = www.shk-wb.ru) {
        return 301 https://shk-wb.ru$request_uri;
    } # managed by Certbot

    if ($host = shk-wb.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name shk-wb.ru www.shk-wb.ru;
    return 404; # managed by Certbot
}
