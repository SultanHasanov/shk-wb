  <title>Технические работы — Генератор стикеров Wildberries</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f4f8;
      color: #1d1d27;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border: 1px solid #e6e6ee;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(29, 29, 39, .06);
    }

    .logo {
      font-weight: 800;
      font-size: 34px;
      color: #cb11ab;
      letter-spacing: -1px;
    }

    h1 {
      margin: 20px 0 12px;
      font-size: 24px;
      font-weight: 700;
    }

    p {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.5;
      color: #55555f;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
    }

    .btn-wa { background: #25D366; }
    .btn-wa:hover { background: #1eb955; }

    .btn-tg { background: #229ED9; }
    .btn-tg:hover { background: #1b86ba; }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 32px 20px; }
      h1 { font-size: 21px; }
    }
  </style>
</head>

</html>
